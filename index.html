<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>今週の地上波/BSアニメ番組表</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="viz-root">

  <a class="back-link" href="https://hinoyasai1984-afk.github.io/">← アプリ一覧に戻る</a>

  <header class="app-header">
    <div>
      <h1>今週の地上波/BSアニメ番組表</h1>
      <p class="subtitle" id="header-subtitle">本日を含む今週分の放送予定を、地上波(関東)とBSの主要チャンネルから集めています。</p>
    </div>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="配色を切り替え">🌓</button>
  </header>

  <section class="toolbar">
    <div class="day-filter" id="day-filter" role="group" aria-label="曜日で絞り込み"></div>
    <button id="update-button" class="update-button" type="button">✓ チェックした作品を上に</button>
  </section>

  <p id="status-line" class="status-line" role="status">読み込み中…</p>

  <section class="show-list" id="show-list"></section>

  <footer class="app-footer">
    データ提供: <a href="https://cal.syoboi.jp/" target="_blank" rel="noopener">しょぼいカレンダー</a>
    対象チャンネル: NHK総合/Eテレ、日本テレビ、TBS、フジテレビ、テレビ朝日、テレビ東京、TOKYO MX、tvk、チバテレビ、テレ玉、群馬テレビ、とちぎテレビ、および主要BS局。<br>
    データソースの仕様上、既に放送が終わった同週内の日（本日より前の曜日）は表示できません。チェック状態はこの端末に保存されます。
  </footer>

</div>

<script src="app.js"></script>
</body>
</html>
